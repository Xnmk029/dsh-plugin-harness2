# Sample of the --patch that DshSubstrate.materialise() writes to <work_dir>/candidate.patch.yml.
# Real runs use the actual absolute work_dir; /ABS/PATH/TO/work_dir is a placeholder.
# Regenerate: python3 -m harness2_dsh.dry_run --tree examples/demo_harness  (prints the real one)
# Generated by harness2_dsh (install mode dsh_workspace). One copy per candidate/rollout.
# Replaces the bundle row `harness2` (dsh-plugin-harness2); all paths are absolute.
- id: tool-web
  disabled: true

- id: harness2
  config:
    sections:
      systemPromptFile: "/ABS/PATH/TO/work_dir/systemprompt.md"
      guardrailsFile: "/ABS/PATH/TO/work_dir/guardrails.md"
      memoryFile: "/ABS/PATH/TO/work_dir/LongTermMEMORY.md"
      toolGuidanceFile: "/ABS/PATH/TO/work_dir/tool_descriptions/tool_guidance.md"
    recorder:
      path: "/ABS/PATH/TO/work_dir/.harness2/trajectory.jsonl"
      text: true
      textPath: "/ABS/PATH/TO/work_dir/.harness2/trajectory.jsonl.txt"
      maxChars: 16384
    guard:
      denyTools: ["web_search", "web_fetch"]
      denyPathGlobs: ["**/.harness2/**"]
      pathArgKeys: ["file_path", "path", "paths", "filePath"]
